                            <!-- Kakao Maps SDK -->
                            <script
                                type="text/javascript"

                            <!-- 카카오 지도 -->
                            <div class="map_box">
                                <div class="kakao_map" id="kakao_map"></div>
                                <div class="map_address">인천광역시 연수구 첨단대로 40 B동 803호<br>
                                    <span>(에스파이브시티)</span>
                                </div>
                            </div>

                            <script>
                                $(window).on('load', function () {

                                    var mapContainer = document.getElementById('kakao_map');

                                    var mapOption = {
                                        center: new kakao.maps.LatLng(37.3825, 126.6565),
                                        level: 3
                                    };

                                    var map = new kakao.maps.Map(mapContainer, mapOption);

                                    // 장소 검색
                                    var ps = new kakao.maps.services.Places();

                                    ps.keywordSearch('제노바디 송도점', function(data, status) {

                                        if (status === kakao.maps.services.Status.OK && data.length > 0) {

                                            var place = data[0];

                                            var position = new kakao.maps.LatLng(
                                                place.y,
                                                place.x
                                            );

                                            // 지도 중심 이동
                                            map.setCenter(position);

                                            // 마커
                                            var marker = new kakao.maps.Marker({
                                                position: position
                                            });

                                            marker.setMap(map);

                                            // 클릭 가능한 인포윈도우
                                            var content =
                                                '<div style="' +
                                                    'padding:12px 16px;' +
                                                    'font-size:14px;' +
                                                    'line-height:1.5;' +
                                                    'white-space:nowrap;' +
                                                '">' +
                                                    '<strong>제노바디 송도점</strong><br>' +
                                                    '<span style="font-size:12px;color:#777;">' +
                                                        (place.road_address_name || place.address_name) +
                                                    '</span>' +
                                                '</div>';

                                            var infowindow = new kakao.maps.InfoWindow({
                                                content: content
                                            });

                                            infowindow.open(map, marker);

                                            // 마커 클릭 시 카카오맵 상세페이지
                                            kakao.maps.event.addListener(marker, 'click', function () {
                                                if (place.place_url) {
                                                    window.open(place.place_url, '_blank');
                                                }
                                            });
                                        }

                                    });

                                });
                            </script>
